# The About page narrative, in Markdown, first person. Shown under the bio.
about: |
  I am an engineering student at Telecom Nancy, in the IAMD track (artificial
  intelligence and big data), and I am following the ISMD Master's in
  statistics and machine learning at Université de Lorraine in parallel. The
  combination is deliberate: engineering taught me to build models, statistics
  taught me to distrust them until the evidence is in.

  What draws me to research is a question that keeps coming back in different
  forms: *what does a network actually learn about the structure of its data?*
  I approach it from three sides: the representations of deep networks, the
  dynamics of biological circuits, and the spectral geometry of graphs, which
  offers a common language for both.

  This site is where I think out loud. Most posts are notebooks written next to
  the code they describe, published as soon as they are worth reading rather
  than when they are finished.

# Shown on the About page.
interests:
  - name: Representation learning
    text: >-
      What a trained network encodes, and why some representations transfer
      while others only fit. I work with latent-variable models (VAEs,
      dimensionality reduction) and look for structure a model found without
      being told to.
  - name: Computational neuroscience
    text: >-
      Recurrent and spiking networks as models of cognitive processes, and the
      reverse question: which ideas from biological circuits make artificial
      architectures learn better.
  - name: Spectral graph theory
    text: >-
      The Laplacian and adjacency spectra as a lens on graph structure, and
      their use in geometric deep learning: spectral convolutions, positional
      encodings and the optimisation of graph neural networks.

# Add a project by appending an entry here. Each one gets its own page at
# /projects/<slug>/.
#
#   featured: true   also show it on the home page
#   repo:            owner/name on GitHub
#   short:           compact label for chips and post badges (defaults to name)
#   blog:            folder in that repo whose posts join this site.
#                    Remove the key to stop pulling posts from that project.
#   branch:          only if the posts do not live on the default branch
#   activity: false  hide the commit heatmap (shown by default when `repo` is set)
#   image:           preview image when the project page is shared, instead of
#                    the generated one (a /rooted path or a full URL)
projects:
  - name: Symbolic music generation with recurrent neural networks
    slug: music-generation-rnn
    short: Music generation
    context: Personal project
    featured: true
    repo: lucastabary/Project4
    blog: blog
    text: >-
      A study of LSTM architectures for MIDI sequence generation, focused on how
      well the model captures long-range temporal structure in classical music
      corpora.
    links:
      - label: Code
        url: https://github.com/lucastabary/Project4/

  - name: Near-infrared spectroscopy analysis of plant specimens
    slug: nirs-spectroscopy
    short: NIRS spectroscopy
    context: Research initiation project • Telecom Nancy
    featured: true
    repo: lucastabary/PIDR_RICOCHET
    blog: blog
    text: >-
      Latent space exploration of NIRS measurements for the chemical
      characterisation of plant specimens, using dimensionality reduction
      (PCA, t-SNE, VAE) ahead of classification.
    links:
      - label: Code
        url: https://github.com/lucastabary/PIDR_RICOCHET

  - name: EarTrainer
    slug: eartrainer
    short: EarTrainer
    context: Personal project
    featured: false
    repo: lucastabary/EarTrainer
    blog: blog
    text: >-
      A small web tool for practising interval and chord recognition by ear.
    links:
      - label: Code
        url: https://github.com/lucastabary/EarTrainer

