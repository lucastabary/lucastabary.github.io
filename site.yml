interests:
  - name: Machine Learning
    text: >-
      Artificial neural networks, supervised and unsupervised learning, and what
      makes a representation generalise.
  - name: Computational Neuroscience
    text: >-
      Modelling cognitive processes, and the analogies between biological
      networks and artificial architectures such as RNNs and spiking neural
      networks.
  - name: Algebraic Graph Theory
    text: >-
      Spectral properties of graphs (Laplacian, adjacency spectrum) and their
      use in geometric deep learning and graph neural network optimisation.

